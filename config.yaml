  #       password: "TestPass@123"
  #       role: "user"
  #     user_b:
  #       email: "tester2@example.com"
  #       password: "TestPass@123"
  #       role: "user"
  #     admin:
  #       email: "admin@example.com"
  #       password: "AdminPass@123"
  #       role: "admin"

# ─────────────────────────────────────────────────────────
# SCAN SETTINGS
# ─────────────────────────────────────────────────────────
scanning:
  timeout: 10
  retry_attempts: 3
  rate_limit_delay: 0.5
  max_concurrent_requests: 5
  rate_limit_test_count: 50
  bola_test_ids: [1, 2, 3, 4, 5]        # IDs to try in generic BOLA
  ssrf_payloads:
    - "https://www.google.com"
    - "http://169.254.169.254/latest/meta-data/"
    - "http://localhost:80"
    - "http://127.0.0.1:22"

# ─────────────────────────────────────────────────────────
# REPORTING
# ─────────────────────────────────────────────────────────
reporting:
  output_dir: "./reports"
  formats:
    - html
    - json

# ─────────────────────────────────────────────────────────
# ETHICS
# ─────────────────────────────────────────────────────────
ethics:
  require_authorization_confirmation: true
  log_all_targets: true
